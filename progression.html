<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
html,body{margin:0;background:#191919;color:#d4d4d4;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media (prefers-color-scheme: light){html,body{background:#fff;color:#37352f}}
.r{margin:10px 6px}
.b{height:8px;margin-top:4px;border-radius:4px;background:rgba(127,127,127,.25);overflow:hidden}
.f{height:100%;background:currentColor}
</style></head><body><div id="p"></div><script>
function f(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),mon=d-(n.getDay()+6)%7;
const R=[['Jour',new Date(y,m,d),new Date(y,m,d+1)],['Semaine',new Date(y,m,mon),new Date(y,m,mon+7)],['Mois',new Date(y,m,1),new Date(y,m+1,1)],['Année',new Date(y,0,1),new Date(y+1,0,1)]];
document.getElementById('p').innerHTML=R.map(([l,a,b])=>{const p=Math.floor((n-a)/(b-a)*100);return`<div class="r">${l} : ${p} %<div class="b"><div class="f" style="width:${p}%"></div></div></div>`}).join('')}
f();setInterval(f,60000);
</script></body></html>
