<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
:root{--bg:#191919;--fg:#d4d4d4;--mut:#7f7f7f;--line:rgba(255,255,255,.13)}
@media (prefers-color-scheme: light){:root{--bg:#fff;--fg:#37352f;--mut:#9b9a97;--line:rgba(55,53,47,.16)}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;user-select:none}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.ring{position:relative;width:min(84vw,190px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.5}
.track{stroke:var(--line)}
#arc{stroke:var(--fg);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(14vw,40px);font-weight:300;font-variant-numeric:tabular-nums}
.dur{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
input{width:3em;background:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;text-align:center;padding:4px 0;-moz-appearance:textfield}
input::-webkit-inner-spin-button{-webkit-appearance:none}
button{background:none;border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;font-size:12px;padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mut)}
.step{width:26px;padding:4px 0}
.ctl{display:flex;gap:8px}
:disabled{opacity:.35;cursor:default}
</style></head><body>
<div class="lbl" id="lbl">Focus</div>
<div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="47"/><circle id="arc" cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="100"/></svg><div class="t" id="t">25:00</div></div>
<div class="dur"><button class="step" id="minus" aria-label="Moins 5 minutes">−</button><input id="min" type="number" min="1" max="180" aria-label="Durée en minutes"> min<button class="step" id="plus" aria-label="Plus 5 minutes">+</button></div>
<div class="ctl"><button id="go">Démarrer</button><button id="rs">Réinitialiser</button></div>
<script>
const $=id=>document.getElementById(id),t=$('t'),arc=$('arc'),go=$('go'),inp=$('min'),lbl=$('lbl');
let len=0,left=0,end=0,iv=0,ac;
// durée en minutes, bornée à 1–180 ; saisie invalide → on garde la durée actuelle
const clamp=m=>{const v=parseInt(m,10);return Number.isNaN(v)?(len/60||25):Math.min(180,Math.max(1,v))};
function setLen(m){len=clamp(m)*60;left=len;inp.value=len/60;try{localStorage.focusMin=len/60}catch(e){}show()}
function show(){t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');arc.style.strokeDashoffset=100-left/len*100}
function lock(on){for(const e of [inp,$('minus'),$('plus')])e.disabled=on}
function stop(){clearInterval(iv);iv=0;go.textContent=left&&left<len?'Reprendre':'Démarrer'}
function beep(){try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=660;g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.2);o.start();o.stop(ac.currentTime+1.2)}catch(e){}}
go.onclick=()=>{
  if(iv)return stop();
  try{ac=ac||new AudioContext()}catch(e){} // créé au clic : sinon le son de fin est bloqué
  if(!left){left=len;show()}
  lbl.textContent='Focus';lock(true);end=Date.now()+left*1000;go.textContent='Pause';
  iv=setInterval(()=>{left=Math.max(0,Math.ceil((end-Date.now())/1000));show();if(!left){stop();lock(false);lbl.textContent='Terminé';beep()}},250)};
$('rs').onclick=()=>{stop();lock(false);lbl.textContent='Focus';left=len;show();go.textContent='Démarrer'};
$('minus').onclick=()=>setLen(len/60-5);
$('plus').onclick=()=>setLen(len/60+5);
inp.onchange=()=>setLen(inp.value);
let saved=25;try{saved=localStorage.focusMin||25}catch(e){}
setLen(saved);
</script></body></html>
